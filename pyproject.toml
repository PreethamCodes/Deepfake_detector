[project]
name = "truthscan"
version = "0.1.0"
description = "Multimodal deepfake detection platform"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["httpx>=0.27,<0.29", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

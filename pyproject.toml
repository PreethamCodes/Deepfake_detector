[project]
name = "truthscan"
version = "0.1.0"
description = "Multimodal deepfake detection platform"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.26,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["httpx>=0.27,<0.29", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
audio = ["torch>=2.8,<3", "av>=16,<20", "numpy>=1.26,<3"]
image = ["clip", "pillow>=11", "torch>=2.8,<3", "torchvision>=0.23,<1"]
video = ["av>=16,<20", "opencv-python-headless>=4.11,<5", "numpy>=1.26,<3"]
gend = ["torch>=2.8,<3", "torchvision>=0.23,<1", "transformers==4.56.2",
        "safetensors>=0.5,<1", "pillow>=11"]

[tool.uv.sources]
clip = { git = "https://github.com/openai/CLIP", rev = "d05afc436d78f1c48dc0dbf8e5980a9d471f35f6" }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

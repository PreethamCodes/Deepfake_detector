server {
    listen 80;
    root /usr/share/nginx/html;

    # Matches the API's combined request cap (340 MiB plus multipart framing).
    client_max_body_size 341m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Stream uploads to FastAPI and allow long CPU analyses (the UI waits up to 15 minutes).
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
